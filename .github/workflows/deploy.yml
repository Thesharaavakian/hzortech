name: Deploy Hzortech

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-key-not-used-in-production
      DJANGO_TEST_STATIC: simple
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check business_page hzortech

      - name: Django check
        run: python manage.py check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck + lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Django tests render real templates (base.html calls {% vite_entry %}),
      # which needs frontend/dist/.vite/manifest.json — so this has to run
      # after the frontend build, not before it.
      - name: Django tests
        run: python manage.py test business_page

      - name: collectstatic (verifies the Vite manifest resolves)
        run: python manage.py collectstatic --noinput

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. Build & push image ────────────────────────────────────────────
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thesharaavakian/hzortech:latest
            ghcr.io/thesharaavakian/hzortech:${{ github.sha }}

      # ── 2. Skip if server not ready yet ──────────────────────────────────
      - name: Check EC2_HOST is set
        id: check
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST not set yet — skipping deploy step."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── 3. Deploy via Docker Compose ─────────────────────────────────────
      - name: Deploy to server
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/hzortech"

            # Pull latest code — hard reset ensures local edits never block a deploy
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/Thesharaavakian/hzortech.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin master
              git reset --hard origin/master
            fi

            cd "$APP_DIR"

            # Log in to ghcr.io so docker can pull the image
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new image and restart (migrations run inside the django command)
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for django to be healthy
            echo "Waiting for django to start..."
            for i in $(seq 1 20); do
              docker compose ps django | grep -q "Up" && echo "Django is up." && break
              echo "  [$i/20] not up yet, waiting 5s..."
              sleep 5
            done

            docker compose ps
