<section class="consent" id="consent" hidden aria-labelledby="consent-title">
  <h2 class="t-mono" id="consent-title">Cookies</h2>
  <p>We use one optional cookie — the Meta Pixel — to measure our ads. It only loads if you accept. The only other cookies are strictly necessary ones that protect forms from forgery. <a href="{% url 'privacy' %}#cookies">Details</a></p>
  <div class="cluster">
    <button class="btn btn--small" type="button" data-consent="decline">Decline</button>
    <button class="btn btn--small" type="button" data-consent="accept">Accept</button>
  </div>
</section>
