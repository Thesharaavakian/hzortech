{% load static %}
{% if theme == 'dark' %}
<img class="{{ class|default:'mark' }}" src="{% static 'business_page/img/brand/mark-white.png' %}" alt="" aria-hidden="true">
{% elif theme == 'light' %}
<img class="{{ class|default:'mark' }}" src="{% static 'business_page/img/brand/mark-navy.png' %}" alt="" aria-hidden="true">
{% else %}
<span class="{{ class|default:'mark' }} mark-pair" aria-hidden="true">
  <img class="mark-pair__navy" src="{% static 'business_page/img/brand/mark-navy.png' %}" alt="">
  <img class="mark-pair__white" src="{% static 'business_page/img/brand/mark-white.png' %}" alt="">
</span>
{% endif %}
