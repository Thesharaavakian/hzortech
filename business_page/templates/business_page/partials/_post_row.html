<li class="post-row" data-reveal>
  <article aria-labelledby="post-{{ post.slug }}">
    <a class="post-row__link" href="{{ post.get_absolute_url }}">
      <p class="t-mono post-row__meta"><time datetime="{{ post.published_at|date:'Y-m-d' }}">{{ post.published_at|date:'d M Y' }}</time><span>{{ post.get_topic_display }}</span><span>{{ post.reading_minutes }} min read</span></p>
      <h3 class="t-h4 post-row__title" id="post-{{ post.slug }}">{{ post.title }}</h3>
      <p class="t-small post-row__dek">{{ post.dek }}</p>
      <svg class="post-row__arrow" width="18" height="18" aria-hidden="true"><use href="#i-arrow"/></svg>
    </a>
  </article>
</li>
